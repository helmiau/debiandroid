# SPDX-License-Identifier: MIT
# Release: builds every codename plus the installer zip, then publishes assets.
# Trigger: v* tags only (plus manual dispatch for a dry run).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        codename: [santoni, mido, sagit]
    env:
      DEBIANDROID_OUT: ${{ github.workspace }}/out
      DEBIANDROID_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler cpio zstd shellcheck bats
          python3 -m pip install --quiet --break-system-packages mkbootimg
      - name: Prepare device config
        run: cp "devices/${{ matrix.codename }}.env.example" "devices/${{ matrix.codename }}.env"
      - name: Unit tests
        if: matrix.codename == 'santoni'
        run: ./tests/run.sh
      - name: Verify kernel pin
        run: ./scripts/lib/kernel-pin.sh "${{ matrix.codename }}"
      - name: Build kernel and boot image
        run: |
          ./scripts/build-kernel.sh "${{ matrix.codename }}"
          ./scripts/make-bootimg.sh "${{ matrix.codename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.codename }}
          path: |
            out/${{ matrix.codename }}/boot-*.img
            out/${{ matrix.codename }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: boot-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum boot-*.img > SHA256SUMS || true
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/boot-*.img
            dist/SHA256SUMS
          fail_on_unmatched_files: false
