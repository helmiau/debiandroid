# SPDX-License-Identifier: MIT
# Kernel and boot image build.
# Trigger: manual dispatch (choose one codename) or a v* tag (all codenames).
name: build-kernel

on:
  workflow_dispatch:
    inputs:
      codename:
        description: 'Device codename'
        required: true
        default: santoni
        type: choice
        options: [santoni, mido, sagit]
      upload:
        description: 'Upload artifacts'
        required: false
        default: true
        type: boolean
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        codename: [santoni, mido, sagit]
    env:
      DEBIANDROID_OUT: ${{ github.workspace }}/out
      DEBIANDROID_CACHE: ${{ github.workspace }}/.cache
    steps:
      - name: Decide whether to build this codename
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.codename }}" = "${{ matrix.codename }}" ] && echo "run=1" >> "$GITHUB_OUTPUT" || echo "run=0" >> "$GITHUB_OUTPUT"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
      - name: Install toolchain
        if: steps.gate.outputs.run == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu device-tree-compiler cpio zstd python3
          for t in aarch64-linux-gnu-gcc make dtc python3; do
            command -v "$t" || { echo "missing $t"; exit 1; }
          done
      - name: Prepare device config
        if: steps.gate.outputs.run == '1'
        run: cp "devices/${{ matrix.codename }}.env.example" "devices/${{ matrix.codename }}.env"
      - name: Verify kernel pin
        if: steps.gate.outputs.run == '1'
        run: ./scripts/lib/kernel-pin.sh "${{ matrix.codename }}"
      - name: Build
        if: steps.gate.outputs.run == '1'
        run: |
          ./scripts/build-kernel.sh "${{ matrix.codename }}"
          ./scripts/make-bootimg.sh "${{ matrix.codename }}"
          ls -la "out/${{ matrix.codename }}"
          cat "out/${{ matrix.codename }}/SHA256SUMS" || true
      - name: Upload artifacts
        if: steps.gate.outputs.run == '1' && (github.event_name == 'push' || inputs.upload)
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.codename }}-${{ github.sha }}
          path: |
            out/${{ matrix.codename }}/boot-*.img
            out/${{ matrix.codename }}/Image.gz
            out/${{ matrix.codename }}/*.dtb
            out/${{ matrix.codename }}/SHA256SUMS
            out/${{ matrix.codename }}/build.log
          retention-days: 30
          if-no-files-found: error
